version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /skills/clean-ai-marks
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
