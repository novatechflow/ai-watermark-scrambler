name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/clean-ai-marks/requirements.txt

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The scripts run on stdlib alone and the suite skips the extras when they
      # are absent, so a missing wheel must not fail the build.
      - name: Install optional extras
        continue-on-error: true
        run: python -m pip install -r skills/clean-ai-marks/requirements.txt

      # No pip package exists, so this is the only way the exiftool branches in
      # image_meta and container_meta get exercised.
      - name: Install exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl

      - name: Report tool availability
        run: python3 skills/clean-ai-marks/scripts/ensure_tools.py

      - name: Run tests
        run: make test

      - name: Run smoke
        run: make smoke
